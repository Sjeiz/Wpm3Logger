
[platformio]
default_envs = nodemcuv2-ota

[env:common]
platform = espressif8266
board = nodemcuv2
framework = arduino
build_flags = -Iinclude -Isrc/classes
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^4.0.6
monitor_speed = 115200

[env:nodemcuv2-usb]
extends = env:common
upload_protocol = esptool

[env:nodemcuv2-ota]
extends = env:common
upload_protocol = espota
upload_port = 192.168.12.118
upload_flags =
    --auth="StiebelPumpControl"
    --port=8266
    --host_ip=192.168.10.237
; Host tests: the ISG read path, the state machine and the outputs against live and synthetic ISG
; API responses (TESTING.md). Run with: pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<config.cpp> +<classes/IsgApiManager.cpp> +<classes/StateManager.cpp> +<classes/OutputManager.cpp>
build_flags = -std=gnu++17 -Itest/shim/arduino -Isrc -Isrc/classes
lib_deps = bblanchon/ArduinoJson@^7.2.0
